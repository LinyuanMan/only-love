<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>周家璇 ❤ 满林远 · 恋爱纪念日</title>
<style>
  :root {
    --pink: #ff6b9d;
    --deep-pink: #e75480;
    --gold: #ffd700;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    overflow: hidden;
    position: relative;
    background: linear-gradient(135deg, #2b1055 0%, #7597de 50%, #ff9a9e 100%);
  }
  .bg-hearts {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .heart-float {
    position: absolute;
    bottom: -60px;
    color: rgba(255,255,255,0.35);
    font-size: 24px;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }
  .card {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 40px 30px;
    max-width: 720px;
    width: 92%;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 28px;
    border: 1px solid rgba(255,255,255,0.35);
    box-shadow: 0 25px 60px rgba(0,0,0,0.35);
  }
  .title {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 3px;
    margin-bottom: 6px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }
  .title .heart { color: #ff477e; display: inline-block; animation: beat 1.2s ease-in-out infinite; }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.2); }
    40% { transform: scale(1); }
    60% { transform: scale(1.25); }
  }
  .subtitle {
    font-size: 15px;
    opacity: 0.9;
    letter-spacing: 2px;
    margin-bottom: 30px;
  }
  .date-line {
    font-size: 15px;
    color: #ffe6ee;
    margin-bottom: 26px;
    letter-spacing: 1px;
  }
  .timer {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .box {
    background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 16px;
    padding: 16px 8px;
    min-width: 96px;
    flex: 1;
    max-width: 130px;
    box-shadow: inset 0 0 20px rgba(255,255,255,0.12);
  }
  .box .num {
    font-size: 40px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, #fff, #ffd6e4);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: none;
  }
  .box .label {
    font-size: 12px;
    opacity: 0.9;
    margin-top: 6px;
    letter-spacing: 2px;
  }
  .current-time {
    font-size: 17px;
    letter-spacing: 2px;
    color: #fff5f8;
    margin-top: 8px;
  }
  .current-time .clock { font-weight: 700; color: #ffe9a8; }
  .words {
    margin-top: 26px;
    font-size: 16px;
    line-height: 1.9;
    color: #ffedf3;
    opacity: 0.95;
    min-height: 2.4em;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeIn 1.2s ease both;
  }
  @keyframes fadeIn {
    0% { opacity: 0; transform: translateY(10px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .heart-btn {
    margin-top: 20px;
    padding: 13px 30px;
    font-size: 15px;
    font-family: inherit;
    letter-spacing: 2px;
    color: #fff;
    background: linear-gradient(135deg, #ff6b9d, #e75480);
    border: 2px solid rgba(255,255,255,0.45);
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(231, 84, 128, 0.5);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    position: relative;
  }
  .heart-btn:hover { transform: scale(1.06); box-shadow: 0 10px 30px rgba(231, 84, 128, 0.7); }
  .heart-btn:active { transform: scale(0.94); }
  .burst-heart {
    position: fixed;
    left: 0;
    top: 0;
    pointer-events: none;
    z-index: 5;
    user-select: none;
    will-change: transform, opacity;
    text-shadow: 0 2px 8px rgba(255, 80, 130, 0.5);
  }
  .footer {
    margin-top: 20px;
    font-size: 12px;
    opacity: 0.65;
    letter-spacing: 1px;
  }
  @media (max-width: 480px) {
    .card { padding: 28px 16px; }
    .title { font-size: 26px; }
    .box { min-width: 72px; padding: 12px 4px; }
    .box .num { font-size: 30px; }
    .timer { gap: 8px; }
  }
</style>
</head>
<body>
  <div class="bg-hearts" id="bgHearts"></div>

  <div class="card">
    <div class="title">周家璇 <span class="heart">❤</span> 满林远</div>
    <div class="subtitle">我们的恋爱纪念日</div>
    <div class="date-line">从 2025 年 12 月 6 日 20:08:00 开始</div>

    <div class="timer">
      <div class="box">
        <div class="num" id="days">0</div>
        <div class="label">天</div>
      </div>
      <div class="box">
        <div class="num" id="hours">0</div>
        <div class="label">时</div>
      </div>
      <div class="box">
        <div class="num" id="minutes">0</div>
        <div class="label">分</div>
      </div>
      <div class="box">
        <div class="num" id="seconds">0</div>
        <div class="label">秒</div>
      </div>
    </div>

    <div class="current-time">当前时间：<span class="clock" id="clock">--</span></div>

    <div class="words" id="blessing">✨</div>
    <button class="heart-btn" id="heartBtn">💗 点我喷小心心</button>
    <div class="footer">Forever &amp; Always</div>
  </div>

<script>
  // 恋爱纪念日开始时间：2025年12月6日 20:08:00（北京时间）
  const startDate = new Date("2025-12-06T20:08:00+08:00");

  const pad = (n) => String(n).padStart(2, "0");
  const weekdays = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];

  function update() {
    const now = new Date();
    let diff = Math.floor((now - startDate) / 1000);
    if (diff < 0) diff = 0;

    const days = Math.floor(diff / 86400);
    const hours = Math.floor((diff % 86400) / 3600);
    const minutes = Math.floor((diff % 3600) / 60);
    const seconds = diff % 60;

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = pad(hours);
    document.getElementById("minutes").textContent = pad(minutes);
    document.getElementById("seconds").textContent = pad(seconds);

    const y = now.getFullYear();
    const m = pad(now.getMonth() + 1);
    const d = pad(now.getDate());
    const w = weekdays[now.getDay()];
    const h = pad(now.getHours());
    const min = pad(now.getMinutes());
    const s = pad(now.getSeconds());
    document.getElementById("clock").textContent =
      y + "年" + m + "月" + d + "日 " + w + " " + h + ":" + min + ":" + s;
  }

  // 每次刷新随机展示一条祝福语
  const blessings = [
    "在一起的每一分每一秒，都是我们最珍贵的回忆 ♥",
    "世界很大，我的心里只装得下你 💕",
    "与你相遇，是我此生最幸运的事 ✨",
    "无论多久，我都会一直爱你 💖",
    "你的笑容，是我每天最好的礼物 🌸",
    "牵着你的手，走过每一个春夏秋冬 🍂",
    "因为有你，平凡的日子也变得闪闪发光 🌟",
    "爱你，是我做过最美好的事 💘",
    "愿我们的每一天，都被幸福包围 🏡",
    "你是我漫长岁月里，唯一的心动 💗",
    "往后的日子，我只要你 ❤",
    "每一次心跳，都在对你说：我爱你 💓",
    "和你在一起，连空气都是甜的 🍬",
    "从遇见你的那天起，我的世界就有了光 ☀️",
    "不管走多远，我都会在你身边 🥰"
  ];

  function pickBlessing() {
    const el = document.getElementById("blessing");
    el.classList.remove("anim-restart");
    void el.offsetWidth;
    el.classList.add("anim-restart");
    el.textContent = blessings[Math.floor(Math.random() * blessings.length)];
  }

  // 按钮喷涌小心心
  const heartBtn = document.getElementById("heartBtn");
  const burstEmojis = ["💗", "💖", "💕", "💘", "💝", "💞", "❤️", "💓", "💛", "💜"];

  function burstHearts(sx, sy, count) {
    for (let i = 0; i < count; i++) {
      const h = document.createElement("span");
      h.className = "burst-heart";
      h.textContent = burstEmojis[Math.floor(Math.random() * burstEmojis.length)];
      h.style.fontSize = (16 + Math.random() * 24) + "px";
      document.body.appendChild(h);

      // 向上为主的喷涌方向
      const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.5;
      const speed = 260 + Math.random() * 460;
      const vx = Math.cos(angle) * speed;
      const vy = Math.sin(angle) * speed;
      const gravity = 720;
      const rot = (Math.random() - 0.5) * 900;
      const life = 1300 + Math.random() * 1400;
      const drift = (Math.random() - 0.5) * 140;
      const start = performance.now();
      let x = sx, y = sy;

      function frame(now) {
        const t = (now - start) / 1000;
        x = sx + vx * t + drift * t;
        y = sy + vy * t + 0.5 * gravity * t * t;
        const alpha = t > 0.7 ? Math.max(0, 1 - (t - 0.7) / 0.6) : 1;
        h.style.transform = "translate(" + x + "px," + y + "px) rotate(" + (rot * t) + "deg)";
        h.style.opacity = alpha;
        if (t * 1000 < life && y < window.innerHeight + 80) {
          requestAnimationFrame(frame);
        } else {
          h.remove();
        }
      }
      requestAnimationFrame(frame);
    }
  }

  heartBtn.addEventListener("click", function () {
    const rect = heartBtn.getBoundingClientRect();
    const sx = rect.left + rect.width / 2;
    const sy = rect.top + rect.height / 2;
    burstHearts(sx, sy, 26);
  });

  // 背景漂浮爱心
  const emojis = ["💗", "💖", "💕", "💘", "💝", "💞"];
  const bg = document.getElementById("bgHearts");
  for (let i = 0; i < 16; i++) {
    const span = document.createElement("span");
    span.className = "heart-float";
    span.textContent = emojis[i % emojis.length];
    span.style.left = Math.random() * 100 + "%";
    span.style.fontSize = (16 + Math.random() * 22) + "px";
    span.style.animationDuration = (8 + Math.random() * 10) + "s";
    span.style.animationDelay = (Math.random() * 10) + "s";
    bg.appendChild(span);
  }

  update();
  setInterval(update, 1000);
  pickBlessing();
</script>
</body>
</html>
